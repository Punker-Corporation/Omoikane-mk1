[graph]
all-features = false
no-default-features = false

[advisories]
ignore = [
    # Existing snapshot serialization dependency. Replacing it belongs in a
    # dedicated protocol/storage migration because no safe drop-in upgrade is
    # available for the 1.x format.
    "RUSTSEC-2025-0141",
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true
skip = [
    # actix-server 2.6 still depends on socket2 0.5 while actix-web/tokio use 0.6.
    { name = "socket2", version = "0.5.10" },
    # socket2 0.5 keeps the older Windows bindings; the newer stack uses 0.61.
    { name = "windows-sys", version = "0.52.0" },
    # SQLx 0.8 uses hashlink/hashbrown 0.15 while indexmap uses hashbrown 0.17.
    { name = "hashbrown", version = "0.15.5" },
    # SQLx Postgres pulls whoami/libredox while tokio/parking_lot use the older Redox syscall line.
    { name = "redox_syscall", version = "0.7.5" },
    # SQLx Postgres' etcetera/home stack still carries Windows bindings 0.48.
    { name = "windows-sys", version = "0.48.0" },
    { name = "windows-targets", version = "0.48.5" },
    { name = "windows_aarch64_gnullvm", version = "0.48.5" },
    { name = "windows_aarch64_msvc", version = "0.48.5" },
    { name = "windows_i686_gnu", version = "0.48.5" },
    { name = "windows_i686_msvc", version = "0.48.5" },
    { name = "windows_x86_64_gnu", version = "0.48.5" },
    { name = "windows_x86_64_gnullvm", version = "0.48.5" },
    { name = "windows_x86_64_msvc", version = "0.48.5" },
    # toml 0.9 keeps winnow 0.7 while toml_parser already moved to 1.0.
    { name = "winnow", version = "0.7.15" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
