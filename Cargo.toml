[workspace]
members = [
    "keisan",
    "jikan",
    "butsuri",
    "sekai",
    "daikoku",
    "shinobi",
    "hikari",
    "omoikane_app",
    "omoikane_control",
    "omoikane_web",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
